version: "3.8"

services:
  web:
    build:
      context: .
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-}
        VITE_ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/v3}
        VITE_ASAAS_ENV: ${VITE_ASAAS_ENV:-production}
    expose:
      - "3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_API_URL=${ASAAS_API_URL:-https://api.asaas.com/v3}
      - ASAAS_MASTER_WALLET_ID=${ASAAS_MASTER_WALLET_ID}
      - ASAAS_WEBHOOK_SECRET=${ASAAS_WEBHOOK_SECRET}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://app.navillebarber.pro}
      - POCKETBASE_URL=http://pocketbase:8090
    depends_on:
      - pocketbase
    restart: unless-stopped
    networks:
      - naville-network

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    command: ["serve", "--http=0.0.0.0:8090", "--dir=/pb/pb_data", "--hooksDir=/pb/pb_hooks"]
    expose:
      - "8090"
    environment:
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_API_URL=${ASAAS_API_URL:-https://api.asaas.com/v3}
      - ASAAS_MASTER_WALLET_ID=${ASAAS_MASTER_WALLET_ID}
      - ASAAS_WEBHOOK_SECRET=${ASAAS_WEBHOOK_SECRET}
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb/pb_hooks:ro
    restart: unless-stopped
    networks:
      - naville-network

networks:
  naville-network:
    driver: bridge
